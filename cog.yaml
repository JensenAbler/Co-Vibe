build:
  gpu: true
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
    - "libsndfile1"
    - "cmake"
  python_requirements: "analysis/requirements.txt"
  run:
    - "pip install Cython"
    - "pip install git+https://github.com/CPJKU/madmom@main"
    - "pip install natten==0.17.4"
    - "pip install --no-deps git+https://github.com/facebookresearch/demucs@main"
    # Pre-download ML models so they're baked into the image
    - "python -c \"import demucs.api; demucs.api.Separator(model='htdemucs')\""
    - "python -c \"from madmom.features.beats import RNNBeatProcessor; RNNBeatProcessor()\""
    - "python -c \"from madmom.features.downbeats import RNNDownBeatProcessor; RNNDownBeatProcessor()\""
    - "python -c \"from madmom.audio.chroma import DeepChromaProcessor; DeepChromaProcessor()\""
    - "python -c \"from huggingface_hub import hf_hub_download; [hf_hub_download('taejunkim/allinone', f) for f in ['harmonix-fold0-0vra4ys2.pth','harmonix-fold1-3ozjhtsj.pth','harmonix-fold2-gmgo0nsy.pth','harmonix-fold3-i92b7m8p.pth','harmonix-fold4-1bql5qo0.pth','harmonix-fold5-x4z5zeef.pth','harmonix-fold6-x7t226rq.pth','harmonix-fold7-qwwskhg6.pth']]\""
predict: "predict.py:Predictor"
